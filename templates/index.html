<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг уровня моря</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        #main-content {
            display: none;
        }

        .navbar {
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .nav-links button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .stat-card .stat-unit {
            font-size: 14px;
            color: #999;
            margin-left: 5px;
        }

        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .control-panel h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .control-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .results {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Система мониторинга уровня моря</h1>

        <!-- Форма входа -->
        <div id="login-section" class="login-container">
            <div class="login-form">
                <h2><i class="fas fa-lock"></i> Вход в систему</h2>
                <div class="form-group">
                    <input type="text" id="username" placeholder="Имя пользователя" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
                </div>
                <button class="login-btn" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </div>
        </div>

        <!-- Основной интерфейс -->
        <div id="main-content">
            <div class="navbar">
                <div class="nav-links">
                    <button class="btn-primary" onclick="loadRiskZones()">
                        <i class="fas fa-map-marked-alt"></i> Показать зоны риска
                    </button>
                    <button class="btn-primary" onclick="calculateFlooding()">
                        <i class="fas fa-water"></i> Калькулятор затоплений
                    </button>
                    <button class="btn-secondary" onclick="loadStations()">
                        <i class="fas fa-map-pin"></i> Станции мониторинга
                    </button>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>

            <div class="stats-grid" id="stats-container">
                <div class="stat-card">
                    <h3>📈 Максимальный подъем</h3>
                    <div class="stat-value" id="max-rise">Загрузка...</div>
                </div>
                <div class="stat-card">
                    <h3>⚠️ Зоны риска</h3>
                    <div class="stat-value" id="risk-zones-count">Загрузка...</div>
                </div>
                <div class="stat-card">
                    <h3>👥 Население в зоне риска</h3>
                    <div class="stat-value" id="at-risk-population">Загрузка...</div>
                </div>
            </div>

            <div class="control-panel">
                <h3>🔍 Поиск порта</h3>
                <div class="control-row">
                    <input type="text" id="port-search" placeholder="Введите название порта (например, Венеция)">
                    <button class="btn-primary" onclick="searchPort()">
                        <i class="fas fa-search"></i> Найти
                    </button>
                </div>
            </div>

            <div id="map"></div>
            <div id="error-container"></div>
            <div class="results" id="results" style="display: none;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        let map;
        let apiToken = localStorage.getItem('apiToken');

        // Инициализация при загрузке
        window.onload = function() {
            console.log("Страница загружена");
            initMap();
            if (apiToken) {
                showMainContent();
                loadStats();
            }
        };

        function initMap() {
            console.log("Инициализация карты...");
            // Убеждаемся, что элемент map существует
            const mapElement = document.getElementById('map');
            if (!mapElement) {
                console.error("Элемент карты не найден!");
                return;
            }

            // Создаем карту с правильным центром
            map = L.map('map').setView([30, 0], 2);

            // Добавляем слой карты
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            console.log("Карта инициализирована");

            // Принудительно обновляем размер карты
            setTimeout(function() {
                map.invalidateSize();
            }, 100);
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            console.log("Попытка входа...");

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    apiToken = data.token;
                    localStorage.setItem('apiToken', apiToken);
                    showMainContent();
                    loadStats();
                    loadRiskZones();
                } else {
                    alert('Не удалось войти. Проверьте имя пользователя и пароль.');
                }
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert('Сервис входа временно недоступен. Попробуйте позже.');
            }
        }

        function showMainContent() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // Обновляем размер карты после показа
            setTimeout(function() {
                if (map) {
                    map.invalidateSize();
                }
            }, 200);
        }

        function logout() {
            localStorage.removeItem('apiToken');
            location.reload();
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/sea-level/regions/max-rise', {
                    headers: { 'Authorization': `Bearer ${apiToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        document.getElementById('max-rise').innerHTML =
                            `${data[0].avg_rise_rate.toFixed(1)} <span class="stat-unit">мм/год</span>`;
                        document.getElementById('risk-zones-count').innerHTML =
                            `${data.length} <span class="stat-unit">регионов</span>`;

                        const totalPop = data.reduce((sum, zone) => sum + (zone.population || 0), 0);
                        document.getElementById('at-risk-population').innerHTML =
                            `${(totalPop/1000000).toFixed(1)}M <span class="stat-unit">чел.</span>`;
                    }
                }
            } catch (error) {
                console.error("Ошибка загрузки статистики:", error);
                document.getElementById('max-rise').textContent = 'Нет данных';
            }
        }

        async function loadRiskZones() {
            console.log("Загрузка зон риска...");

            try {
                const response = await fetch('/api/sea-level/regions/max-rise', {
                    headers: { 'Authorization': `Bearer ${apiToken}` }
                });

                if (response.ok) {
                    const zones = await response.json();
                    console.log("Получены зоны:", zones);

                    // Очищаем старые слои (кроме базового)
                    map.eachLayer((layer) => {
                        if (layer instanceof L.Circle || layer instanceof L.Marker) {
                            map.removeLayer(layer);
                        }
                    });

                    zones.forEach(zone => {
                        if (zone.latitude == null || zone.longitude == null) return;
                        const color = zone.avg_rise_rate > 6 ? 'red' :
                                     zone.avg_rise_rate > 4 ? 'orange' : 'yellow';

                        const circle = L.circle([zone.latitude, zone.longitude], {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.3,
                            radius: 80000
                        }).addTo(map);

                        circle.bindPopup(`
                            <b>${zone.region}</b><br>
                            Страна: ${zone.country}<br>
                            Скорость подъема: ${zone.avg_rise_rate.toFixed(1)} мм/год<br>
                            Население: ${(zone.population || 0).toLocaleString()} чел.<br>
                            Ближайшая станция: ${zone.nearest_station || 'нет данных'}
                        `);
                    });

                    map.invalidateSize();
                } else {
                    console.error('Не удалось получить зоны риска из базы данных');
                }
            } catch (error) {
                console.error("Ошибка загрузки зон:", error);
                console.error("Ошибка загрузки зон:", error);
            }
        }

        async function searchPort() {
            const port = document.getElementById('port-search').value;
            if (!port) {
                alert('Введите название порта');
                return;
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').innerHTML = `
                <h3>Порт: ${port}</h3>
                <p>Данные загружаются...</p>
            `;

            try {
                const response = await fetch(`/api/sea-level/port/${encodeURIComponent(port)}`, {
                    headers: { 'Authorization': `Bearer ${apiToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('results').innerHTML = `
                        <h3>📊 Порт: ${data.port_name}</h3>
                        <p>Текущий уровень: ${data.latest_level} мм</p>
                        <p>Изменение: ${data.total_change > 0 ? '+' : ''}${data.total_change} мм</p>
                        <p>Тренд: ${data.trend_mm_per_year.toFixed(1)} мм/год</p>
                        ${data.chart_url ? `<img src="${data.chart_url}" style="max-width: 100%; margin-top: 10px;">` : ''}
                    `;
                } else {
                    document.getElementById('results').innerHTML = `
                        <h3>❌ Порт не найден</h3>
                        <p>Проверьте название станции в базе данных и попробуйте снова</p>
                    `;
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <h3>❌ Ошибка загрузки</h3>
                    <p>Не удалось прочитать данные из базы. Повторите попытку позже.</p>
                `;
            }
        }

        async function calculateFlooding() {
            const rise = prompt('Подъем уровня моря (метров):', '1.0');
            if (!rise) return;

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').innerHTML = '<p>Расчет...</p>';

            try {
                const response = await fetch('/api/flooded-areas/calculation', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ rise_meters: parseFloat(rise) })
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('results').innerHTML = `
                        <h3>🌊 Затопление при подъеме ${rise}м</h3>
                        <p>Площадь затопления: ${result.total_flooded_area_sqkm.toFixed(0)} км²</p>
                        <p>Население в зоне риска: ${result.affected_population.toLocaleString()} чел.</p>
                        <p>Затронуто регионов: ${result.regions_count}</p>
                    `;
                } else {
                    document.getElementById('results').innerHTML = '<p>Не удалось выполнить расчёт по данным базы.</p>';
                }
            } catch (error) {
                document.getElementById('results').innerHTML = '<p>Сервис расчёта временно недоступен.</p>';
            }
        }

        async function loadStations() {
            console.log("Загрузка станций...");

            try {
                const response = await fetch('/api/stations', {
                    headers: { 'Authorization': `Bearer ${apiToken}` }
                });

                if (response.ok) {
                    const stations = await response.json();

                    map.eachLayer((layer) => {
                        if (layer instanceof L.Marker) {
                            map.removeLayer(layer);
                        }
                    });

                    stations.forEach(station => {
                        if (station.latitude && station.longitude) {
                            const marker = L.marker([station.latitude, station.longitude]).addTo(map);
                            marker.bindPopup(`
                                <b>${station.station_name}</b><br>
                                Страна: ${station.country}<br>
                                Бассейн: ${station.ocean_basin}<br>
                                Статус: ${station.is_active ? '🟢 Активна' : '🔴 Неактивна'}
                            `);
                        }
                    });

                    map.invalidateSize();
                }
            } catch (error) {
                console.error("Ошибка загрузки станций:", error);
                alert("Не удалось загрузить станции");
            }
        }
    </script>
</body>
</html>
